---
# Steg 2: VLAN, access-porter og trunk-porter på layer 2-switchene.
# Leser 'vlans' fra vars/network.yml og 'access_ports' / 'trunk_ports'
# fra host_vars/<enhet>.yml
- name: VLAN og porter på layer 2-switchene
  hosts: switches_l2
  gather_facts: no
  vars_files:
    - ../vars/network.yml
  tasks:
    - name: Opprett VLAN
      cisco.ios.ios_config:
        parents: "vlan {{ item.id }}"
        lines:
          - "name {{ item.name }}"
      loop: "{{ vlans }}"
      loop_control:
        label: "VLAN {{ item.id }}"

    - name: Sett access-porter
      cisco.ios.ios_config:
        parents: "interface {{ item.1 }}"
        lines:
          - switchport mode access
          - "switchport access vlan {{ item.0.vlan }}"
      loop: "{{ access_ports | default([]) | subelements('interfaces') }}"
      loop_control:
        label: "{{ item.1 }} -> VLAN {{ item.0.vlan }}"

    - name: Sett trunk-porter
      cisco.ios.ios_config:
        parents: "interface {{ item.interface }}"
        lines: "{{ ['switchport mode trunk'] + (['switchport trunk allowed vlan ' ~ item.allowed_vlans] if item.allowed_vlans is defined else []) }}"
      loop: "{{ trunk_ports | default([]) }}"
      loop_control:
        label: "{{ item.interface }}"

    - name: Lagre konfigurasjonen hvis den er endret
      cisco.ios.ios_config:
        save_when: modified

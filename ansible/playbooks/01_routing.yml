---
# Steg 1: Ruting på routerne og multilayer-switchen.
# Leser 'ip_routing' og 'static_routes' fra host_vars/<enhet>.yml
- name: Ruting (routere og multilayer-switch)
  hosts: routers:switches_l3
  gather_facts: no
  tasks:
    - name: Slå på ip routing (bare multilayer-switch)
      cisco.ios.ios_config:
        lines:
          - ip routing
      when: ip_routing | default(false)

    - name: Sett statiske ruter
      cisco.ios.ios_config:
        lines:
          - "ip route {{ item.network }} {{ item.mask }} {{ item.next_hop }}{{ ' ' ~ item.distance if item.distance is defined else '' }}"
      loop: "{{ static_routes | default([]) }}"
      loop_control:
        label: "{{ item.network }} via {{ item.next_hop }}"

    - name: Lagre konfigurasjonen hvis den er endret
      cisco.ios.ios_config:
        save_when: modified

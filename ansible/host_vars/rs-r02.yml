---
# Router (ISR 4221) - primær HSRP-router (høyest prioritet)
static_routes:
  - { network: 0.0.0.0, mask: 0.0.0.0, next_hop: 172.16.1.1 }

hsrp:
  - interface: GigabitEthernet0/0/1
    group: 20
    vip: 172.16.20.254
    priority: 110

# DHCP: rs-r02 deler ut .100-.149, rs-r04 deler ut .150-.200 (slik at de ikke krasjer)
dhcp_pools:
  - name: VLAN20
    network: 172.16.20.0
    netmask: 255.255.255.0
    default_router: 172.16.20.254
    excluded:
      - { start: 172.16.20.1,   end: 172.16.20.99 }
      - { start: 172.16.20.150, end: 172.16.20.254 }
